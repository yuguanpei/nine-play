<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
html,body,#map { width:100%; height:100%; margin:0; overflow:hidden; background:var(--map-bg,#121d29) }
#map { position:absolute; height:133.333333%; top:0 }
.rider { width:18px; height:20px; filter:drop-shadow(0 1px 2px #082334); position:relative }
.rider::before,.rider::after { content:""; position:absolute; inset:0; background:#eefbff; clip-path:polygon(50% 0,100% 94%,50% 76%,0 94%); transform:rotate(var(--rider-angle,0deg)) }
.rider::after { inset:3px; background:var(--accent,#d8ff4f) }
.finish { display:grid; place-items:center; width:24px; height:24px; border:2px solid #fff; border-radius:50%; background:#283955; color:#fff; font:bold 12px system-ui,sans-serif; box-shadow:0 1px 4px #29354688; box-sizing:border-box }
.amap-logo { background: #c6d2dd; border-radius: 4px; }
.picked { width:18px; height:18px; box-sizing:border-box; border:3px solid var(--accent,#d8ff4f); border-radius:50%; background:#101a24; box-shadow:0 0 0 4px #0007 }
#map .amap-copyright { color: #c6d2dd; }
#map .amap-logo,#map .amap-copyright { margin-bottom:var(--trip-inset, 0px); opacity:0 !important }
</style>
<script src="/config.js"></script>
<script src="/map.js" defer></script>
</head>
<body><main id="map" aria-label="高德地图"></main></body>
</html>
